[project]
name = "tt"
authors = [ { name = "Stephen G. Ware", email = "sgware@gmail.com" } ]
version = "0.9.0"
description = "Python library for Tandem Tales clients."
readme = "readme.md"
license = "GPL-3.0"
license-files = ["license.txt"]
dependencies = [
	"requests>=2.34.2"
]

[project.urls]
"Homepage" = "https://sgware.github.io/tt-client-python"
"Repository" = "https://github.com/sgware/tt-client-python"
"Documentation" = "https://sgware.github.io/tt-client-python"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6"
]
